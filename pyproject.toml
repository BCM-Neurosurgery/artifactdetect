[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "artifactdetect"
version = "0.1.0"
description = "Artifact detection pipeline for LFP recordings, with optional Medtronic Summit device support"
readme = "README.md"
requires-python = ">=3.9"
dependencies = [
    "numpy",
    "pandas",
    "scipy",
    "matplotlib",
]

[project.scripts]
artifact-finder = "artifactdetect.artifact_finder:main"

[tool.setuptools.packages.find]
include = ["artifactdetect*"]
